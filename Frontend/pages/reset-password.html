<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MediVault</title>
    <link rel="stylesheet" href="/Frontend/styles/main.css">
    <link rel="stylesheet" href="/Frontend/styles/responsive.css">
    <style>
        :root {
            --primary-blue: #003f87;
            --dark-text: #191c1e;
            --success-green: #10b981;
            --error-red: #ef4444;
            --warning-yellow: #f59e0b;
        }

        body {
            background: #f9f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 60px 48px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-text);
            margin: 0 0 8px;
            letter-spacing: -0.7px;
        }

        .auth-header p {
            color: #424752;
            font-size: 16px;
            margin: 0;
            line-height: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e1e2ea;
            border-radius: 8px;
            font-size: 16px;
            color: var(--dark-text);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input::placeholder {
            color: #727784;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 63, 135, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #727784;
        }

        .password-requirements {
            background: #f3f4f6;
            border: 1px solid #e1e2ea;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #424752;
        }

        .requirement:last-child {
            margin-bottom: 0;
        }

        .requirement-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .requirement.met .requirement-icon {
            background: var(--success-green);
            color: white;
        }

        .requirement.unmet .requirement-icon {
            background: #e5e7eb;
            color: #9ca3af;
        }

        .requirement.met {
            color: var(--success-green);
        }

        .strength-meter {
            background: #e5e7eb;
            border-radius: 4px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
            background: var(--error-red);
        }

        .strength-bar.fair {
            width: 33%;
            background: var(--warning-yellow);
        }

        .strength-bar.good {
            width: 66%;
            background: #3b82f6;
        }

        .strength-bar.strong {
            width: 100%;
            background: var(--success-green);
        }

        .strength-text {
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }

        .strength-text.weak {
            color: var(--error-red);
        }

        .strength-text.fair {
            color: var(--warning-yellow);
        }

        .strength-text.good {
            color: #3b82f6;
        }

        .strength-text.strong {
            color: var(--success-green);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #003f87, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 63, 135, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e1e2ea;
        }

        .back-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 40px 24px;
            }

            .auth-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🔑</div>
            <h1>Create New Password</h1>
            <p>Set a strong password to secure your MediVault account</p>
        </div>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        placeholder="Enter a strong password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('new-password')">👁️</button>
                </div>
            </div>

            <div class="password-requirements">
                <div style="margin-bottom: 12px; font-weight: 600; color: var(--dark-text);">Password Requirements:</div>

                <div class="requirement unmet" id="length-req">
                    <div class="requirement-icon">✓</div>
                    <span>Minimum 8 characters</span>
                </div>

                <div class="requirement unmet" id="uppercase-req">
                    <div class="requirement-icon">✓</div>
                    <span>At least one uppercase letter (A-Z)</span>
                </div>

                <div class="requirement unmet" id="number-req">
                    <div class="requirement-icon">✓</div>
                    <span>At least one number (0-9)</span>
                </div>

                <div class="requirement unmet" id="special-req">
                    <div class="requirement-icon">✓</div>
                    <span>At least one special character (!@#$%^&*)</span>
                </div>

                <div class="strength-meter">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <div class="strength-text weak" id="strength-text">Password strength: Weak</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn" disabled>Reset Password</button>
        </form>

        <div class="back-link">
            <a href="/Frontend/pages/login-new.html">← Back to Sign In</a>
        </div>
    </div>

    <script src="/Frontend/scripts/utils.js"></script>
    <script src="/Frontend/scripts/api.js"></script>

    <script>
        const passwordInput = document.getElementById('new-password');
        const confirmInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');

        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        // Password validation
        function validatePassword(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
            };

            return requirements;
        }

        // Calculate password strength
        function getPasswordStrength(password) {
            const requirements = validatePassword(password);
            const metCount = Object.values(requirements).filter(Boolean).length;

            if (metCount === 0) return 'weak';
            if (metCount === 1 || metCount === 2) return 'fair';
            if (metCount === 3) return 'good';
            return 'strong';
        }

        // Update password requirements display
        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            const requirements = validatePassword(password);
            const strength = getPasswordStrength(password);

            // Update requirement indicators
            document.getElementById('length-req').classList.toggle('met', requirements.length);
            document.getElementById('length-req').classList.toggle('unmet', !requirements.length);

            document.getElementById('uppercase-req').classList.toggle('met', requirements.uppercase);
            document.getElementById('uppercase-req').classList.toggle('unmet', !requirements.uppercase);

            document.getElementById('number-req').classList.toggle('met', requirements.number);
            document.getElementById('number-req').classList.toggle('unmet', !requirements.number);

            document.getElementById('special-req').classList.toggle('met', requirements.special);
            document.getElementById('special-req').classList.toggle('unmet', !requirements.special);

            // Update strength bar
            const strengthBar = document.getElementById('strength-bar');
            strengthBar.className = `strength-bar ${strength}`;

            const strengthText = document.getElementById('strength-text');
            strengthText.className = `strength-text ${strength}`;
            strengthText.textContent = `Password strength: ${strength.charAt(0).toUpperCase() + strength.slice(1)}`;

            // Enable submit button if all requirements met
            const passwordsMatch = password === confirmInput.value;
            submitBtn.disabled = !(requirements.length && requirements.uppercase && requirements.number && requirements.special && passwordsMatch && password.length > 0);
        });

        // Check password confirmation
        confirmInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const requirements = validatePassword(password);
            const passwordsMatch = password === confirmInput.value;

            submitBtn.disabled = !(requirements.length && requirements.uppercase && requirements.number && requirements.special && passwordsMatch && password.length > 0);
        });

        // Form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (newPassword !== confirmPassword) {
                Utils.showNotification('Passwords do not match', 'error');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting password...';

                // In production, call API to reset password
                // const response = await API.resetPassword(newPassword);

                Utils.showNotification('Password reset successfully! Redirecting to login...', 'success');

                setTimeout(() => {
                    window.location.href = '/Frontend/pages/login-new.html';
                }, 2000);

            } catch (error) {
                Utils.showNotification('Failed to reset password. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
