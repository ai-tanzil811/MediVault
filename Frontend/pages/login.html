<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediVault</title>
    <link rel="stylesheet" href="/Frontend/styles/main.css">
    <link rel="stylesheet" href="/Frontend/styles/responsive.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">💊 MediVault</a>
            <nav id="user-menu"></nav>
        </div>
    </header>

    <main>
        <div class="container flex-center" style="min-height: calc(100vh - 200px);">
            <div class="card" style="max-width: 400px; width: 100%;">
                <div class="card-header text-center">Login</div>

                <div id="form-messages"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>

                <div style="text-align: center; margin-top: 1rem;">
                    <p>Don't have an account? <a href="/Frontend/pages/register.html">Register here</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 MediVault. Local Dispensary Management System.</p>
    </footer>

    <script src="/Frontend/scripts/utils.js"></script>
    <script src="/Frontend/scripts/api.js"></script>
    <script src="/Frontend/scripts/auth.js"></script>

    <script>
        Auth.redirectIfAuthenticated();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messagesDiv = document.getElementById('form-messages');

            // Validate
            if (!Utils.validateEmail(email)) {
                Utils.showNotification('Invalid email format', 'error');
                return;
            }

            if (password.length < 6) {
                Utils.showNotification('Password must be at least 6 characters', 'error');
                return;
            }

            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';

                await Auth.handleLogin(email, password);
            } catch (error) {
                Utils.showNotification('Login failed: Invalid credentials', 'error');
                document.querySelector('button[type="submit"]').disabled = false;
                document.querySelector('button[type="submit"]').textContent = 'Login';
            }
        });
    </script>
</body>
</html>
